<!DOCTYPE html>
<html lang="{{ site.lang }}" class="no-js">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">

  <title>{{ page.title_tag }}</title>
  <meta name="description" content="{{ page.description }}">
  <meta name="author" content="{{ site.name }}">
  <meta name="google-site-verification" content="{{ site.google_site_verification }}">

  <link rel="canonical" href="{{ page.canonical }}">
{{ build.alternates }}
  <link rel="icon" type="image/svg+xml" href="{{ page.root }}{{ site.favicon }}">
  <link rel="preload" as="font" type="font/woff2" href="{{ page.root }}assets/fonts/Noto-Sans-regular/Noto-Sans-regular.woff2" crossorigin>
  <link rel="stylesheet" href="{{ page.root }}assets/css/main.css?v={{ build.asset_version }}">

  <script>
    // Before first paint, or the pinned theme flashes the other one on every
    // page load. Reads one key and sets one attribute; everything else the
    // switch does is CSS.
    (function () {
      var root = document.documentElement;
      root.classList.remove('no-js');
      try {
        var stored = localStorage.getItem('theme');
        if (stored === 'light' || stored === 'dark') {
          root.setAttribute('data-theme', stored);
        }
      } catch (error) {
        // Storage can throw outright in a locked-down browser, not merely
        // return null. The reader still gets their system's scheme.
      }
    })();
  </script>

  <meta property="og:type" content="{{ page.og_type }}">
  <meta property="og:title" content="{{ page.title_tag }}">
  <meta property="og:description" content="{{ page.description }}">
  <meta property="og:url" content="{{ page.canonical }}">
  <meta property="og:locale" content="{{ site.locale }}">
  <meta property="og:site_name" content="{{ site.name }}">
  <meta property="og:image" content="{{ site.base_url }}/{{ site.portrait }}">
  <!-- Measured from the file at build time, never typed. A crawler given the
       size lays the card out on its first pass instead of deferring until it
       has fetched and decoded the image, and several never make a second pass. -->
  <meta property="og:image:width" content="{{ site.portrait_width }}">
  <meta property="og:image:height" content="{{ site.portrait_height }}">
  <meta property="og:image:alt" content="{{ site.portrait_alt }}">
  <!-- `summary`, not `summary_large_image`. The image is a square portrait and
       the large card is a 2:1 crop, which would cut a face in half. -->
  <meta name="twitter:card" content="summary">

  <script type="application/ld+json">{{ build.json_ld }}</script>
</head>

<body>
  <a class="skip-link" href="#main">{{ chrome.skip }}</a>

  <div class="layout">

    <header class="site-header">
      <div class="site-header__brand">
        <a class="site-header__name" href="{{ page.home }}">{{ site.name }}</a>
        <div class="site-header__details">
          <span class="site-header__role">{{ site.role }}</span>
          <a class="site-header__cv" href="{{ page.root }}{{ site.resume }}" target="_blank" rel="noopener">{{ chrome.cv }}</a>
          <div class="theme-switch" role="group" aria-label="{{ chrome.theme_group }}">
            <span class="theme-switch__label">{{ chrome.theme }}</span>
            <button class="theme-switch__option" type="button" data-theme-value="system">{{ chrome.theme_system }}</button>
            <span class="theme-switch__sep" aria-hidden="true">&middot;</span>
            <button class="theme-switch__option" type="button" data-theme-value="light">{{ chrome.theme_light }}</button>
            <span class="theme-switch__sep" aria-hidden="true">&middot;</span>
            <button class="theme-switch__option" type="button" data-theme-value="dark">{{ chrome.theme_dark }}</button>
          </div>
{{ build.lang_switch }}
        </div>
      </div>
      <nav class="nav" aria-label="{{ chrome.primary_nav }}">
        <ul class="nav__list">
{{ build.nav }}
        </ul>
      </nav>
    </header>

    <div class="page-body">
      <aside class="sidebar-context">
{{ build.page_context }}
      </aside>

      <main id="main" class="content">
{{ page.content }}
      </main>
    </div>

    <footer class="site-footer">
      <p>{{ chrome.last_update }}: {{ site.last_updated }} &middot; {{ chrome.hosted }} &middot; {{ site.name }}</p>
    </footer>

  </div>

  <script>
    // The switch. Appearance is CSS reading [data-theme] off <html>; this only
    // records the choice and keeps the buttons' pressed state truthful.
    (function () {
      var root = document.documentElement;
      var group = document.querySelector('.theme-switch');
      if (!group) { return; }
      var options = group.querySelectorAll('.theme-switch__option');

      function sync() {
        var current = root.getAttribute('data-theme') || 'system';
        for (var i = 0; i < options.length; i++) {
          var pressed = options[i].getAttribute('data-theme-value') === current;
          options[i].setAttribute('aria-pressed', pressed ? 'true' : 'false');
        }
      }

      group.addEventListener('click', function (event) {
        var button = event.target.closest('.theme-switch__option');
        if (!button) { return; }
        var choice = button.getAttribute('data-theme-value');
        if (choice === 'system') {
          root.removeAttribute('data-theme');
        } else {
          root.setAttribute('data-theme', choice);
        }
        try {
          if (choice === 'system') {
            localStorage.removeItem('theme');
          } else {
            localStorage.setItem('theme', choice);
          }
        } catch (error) {
          // The choice still holds for this page view.
        }
        sync();
      });

      sync();
    })();
  </script>

  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.analytics_id }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', '{{ site.analytics_id }}');
  </script>
</body>

</html>
