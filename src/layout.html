<!DOCTYPE html>
<html lang="{{ site.lang }}">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">

  <title>{{ page.title_tag }}</title>
  <meta name="description" content="{{ page.description }}">
  <meta name="author" content="{{ site.name }}">
  <meta name="google-site-verification" content="{{ site.google_site_verification }}">

  <link rel="canonical" href="{{ page.canonical }}">
  <link rel="icon" type="image/svg+xml" href="{{ site.favicon }}">
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/Noto-Sans-regular/Noto-Sans-regular.woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/main.css?v={{ build.asset_version }}">

  <meta property="og:type" content="{{ page.og_type }}">
  <meta property="og:title" content="{{ page.title_tag }}">
  <meta property="og:description" content="{{ page.description }}">
  <meta property="og:url" content="{{ page.canonical }}">
  <meta property="og:locale" content="{{ site.locale }}">
  <meta property="og:site_name" content="{{ site.name }}">
  <meta property="og:image" content="{{ site.base_url }}/{{ site.portrait }}">
  <meta name="twitter:card" content="summary">

  <script type="application/ld+json">{{ build.json_ld }}</script>
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="layout">

    <header class="site-header">
      <div class="site-header__brand">
        <a class="site-header__name" href="index.html">{{ site.name }}</a>
        <div class="site-header__details">
          <span class="site-header__role">{{ site.role }}</span>
          <a class="site-header__cv" href="{{ site.resume }}" target="_blank" rel="noopener">CV (PDF)</a>
        </div>
      </div>
      <nav class="nav" aria-label="Primary">
        <ul class="nav__list">
{{ build.nav }}
        </ul>
      </nav>
    </header>

    <div class="page-body">
      <aside class="sidebar-context" aria-label="Page shortcuts">
{{ build.page_context }}
      </aside>

      <main id="main" class="content">
{{ page.content }}
      </main>
    </div>

    <footer class="site-footer">
      <p>Last update: {{ site.last_updated }} &middot; Hosted on GitHub Pages &middot; Youssef Boutaleb</p>
    </footer>

  </div>

  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.analytics_id }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', '{{ site.analytics_id }}');
  </script>
</body>

</html>
